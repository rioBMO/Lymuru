name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails CLI (version from go.mod)
        run: |
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: Go test
        run: go test ./backend/...

      - name: Wails build
        run: wails build

      - name: Type check
        run: bun run typecheck
        working-directory: frontend

      - name: Frontend tests
        run: bun test
        working-directory: frontend

      - name: Go build
        run: go build ./...
